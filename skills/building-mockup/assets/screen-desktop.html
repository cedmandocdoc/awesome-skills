<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1440, initial-scale=1">
<title>[NN] [Screen name] — [App name]</title>
<style>
  @font-face { font-family: "[Heading family]"; src: url("../fonts/[heading].woff2") format("woff2"); font-weight: 400 800; }
  @font-face { font-family: "[Body family]"; src: url("../fonts/[body].woff2") format("woff2"); font-weight: 400 700; }
  :root {
    /* from design.md tokens */
    --background: [#FFFFFF]; --foreground: [#0F172A];
    --primary: [brand]; --primary-foreground: [#FFFFFF];
    --muted: [#F1F5F9]; --muted-foreground: [#64748B];
    --border: [#E2E8F0]; --success: [#16A34A];
    --radius-md: 10px; --radius-lg: 16px; --radius-full: 9999px;
    --space-2: 8px; --space-3: 12px; --space-4: 16px; --space-6: 24px;
    --font-brand: "[Heading family]", system-ui, sans-serif; --font-body: "[Body family]", system-ui, sans-serif;
    --text-heading-lg: 700 24px/1.25 var(--font-brand); --text-heading-md: 600 18px/1.3 var(--font-brand);
    --text-body-base: 400 16px/1.5 var(--font-body); --text-body-sm: 400 14px/1.43 var(--font-body);
    --text-label: 600 14px/1.3 var(--font-body);
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1440px; height: 900px; overflow: hidden; }
  body { display: flex; flex-direction: column; background: var(--background); color: var(--foreground); font: var(--text-body-base); }
  /* browser chrome and badge: fixed values */
  .browser { flex: none; height: 44px; display: flex; align-items: center; gap: 12px; padding: 0 16px; background: #E8E8EC; border-bottom: 1px solid #D4D4DA; font: 400 13px/1 system-ui, sans-serif; color: #55555E; }
  .dots { display: flex; gap: 8px; } .dots i { width: 12px; height: 12px; border-radius: 50%; background: #C8C8CE; }
  .address { flex: 1; max-width: 640px; margin: 0 auto; height: 28px; display: flex; align-items: center; padding: 0 12px; border-radius: 8px; background: #FFFFFF; }
  .app { flex: 1; display: flex; min-height: 0; }
  nav { flex: none; width: 240px; padding: var(--space-6) var(--space-4); border-right: 1px solid var(--border); }
  main { flex: 1; min-width: 0; padding: var(--space-6); overflow: hidden; }
  header { display: flex; align-items: center; gap: var(--space-3); margin-bottom: var(--space-6); }
  .badge { margin-left: auto; white-space: nowrap; padding: 2px 8px; border-radius: 9999px; background: #F1F1F4; color: #55555E; font: 600 11px/1.4 system-ui, sans-serif; }
  .primary { padding: var(--space-3) var(--space-6); border: 0; border-radius: var(--radius-md); background: var(--primary); color: var(--primary-foreground); font: var(--text-label); }
</style>
</head>
<body>
  <div class="browser"><span class="dots"><i></i><i></i><i></i></span><span>[back · forward as inline SVG]</span><span class="address">[/path/of-this-screen]</span></div>
  <div class="app">
    <nav><!-- [The app's navigation: its name, then 5–7 sections, the current one marked] --></nav>
    <main>
      <header>
        <h1>[Screen heading]</h1>
        <span class="badge">Sample app</span>
      </header>
      <!-- [Screen content with realistic sample data: a table, a form, a summary] -->
      <button class="primary" id="[target-id]">[Action]</button>
    </main>
  </div>
</body>
</html>
