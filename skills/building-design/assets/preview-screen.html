<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>[Screen] — [task]</title>
  <style>
    :root {
      --color-background: [value];
      --color-foreground: [value];
      --color-primary: [value];
      --color-primary-foreground: [value];
      --font-body: [family], system-ui, sans-serif;
      --text-body-base-size: [px];
      --text-body-base-line: [unitless];
      --space-4: [px];
      --radius-md: [px];
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: #1a1a1a;
      color: #f5f5f5;
      font: 12px/1.4 system-ui, sans-serif;
    }

    .board {
      display: flex;
      flex-direction: column;
      gap: 32px;
      padding: 24px;
    }

    .row {
      display: flex;
      flex-direction: row;
      gap: 24px;
      overflow-x: auto;
    }

    .frame {
      flex: 0 0 auto;
      margin: 0;
    }

    .frame figcaption {
      margin: 0 0 8px;
      font: 12px/1.3 system-ui, sans-serif;
      color: #c8c8c8;
    }

    .frame-canvas {
      overflow: hidden;
      pointer-events: none;
      background: var(--color-background);
      color: var(--color-foreground);
      font-family: var(--font-body);
      font-size: var(--text-body-base-size);
      line-height: var(--text-body-base-line);
    }

    .frame-canvas[data-viewport="desktop"] { width: 1440px; height: 900px; }
    .frame-canvas[data-viewport="tablet"] { width: 768px; height: 1024px; }
    .frame-canvas[data-viewport="mobile"] { width: 390px; height: 844px; }
  </style>
</head>
<body>
  <main class="board">
    <section>
      <div class="row">
        <figure class="frame">
          <figcaption>[Screen] · [state] · Desktop 1440×900</figcaption>
          <div class="frame-canvas" data-viewport="desktop">
            <!-- product UI for this screen × state -->
          </div>
        </figure>
        <figure class="frame">
          <figcaption>[Screen] · [state] · Tablet 768×1024</figcaption>
          <div class="frame-canvas" data-viewport="tablet">
            <!-- product UI for this screen × state -->
          </div>
        </figure>
        <figure class="frame">
          <figcaption>[Screen] · [state] · Mobile 390×844</figcaption>
          <div class="frame-canvas" data-viewport="mobile">
            <!-- product UI for this screen × state -->
          </div>
        </figure>
      </div>
    </section>
    <!-- repeat section + row per distinct state -->
  </main>
</body>
</html>
