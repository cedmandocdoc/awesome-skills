<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Design preview</title>
<style>
/* Viewer chrome only — neutral on purpose, never part of the design. */
:root { --bg: #151516; --panel: #1e1e20; --line: #2e2e31; --ink: #ededee; --ink-2: #a2a2a8; --on: #ffffff; --on-ink: #111; }
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { display: grid; grid-template-columns: 240px 1fr; background: var(--bg); color: var(--ink); font: 13px/1.4 system-ui, -apple-system, sans-serif; }
aside { border-right: 1px solid var(--line); background: var(--panel); overflow-y: auto; padding: 14px 10px 20px; }
h2 { margin: 18px 6px 6px; font-size: 10.5px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-2); }
h2:first-child { margin-top: 0; }
.list { display: grid; gap: 2px; }
.list button, .seg button { appearance: none; border: 0; background: transparent; color: var(--ink); font: inherit; text-align: left; padding: 6px 8px; border-radius: 6px; cursor: pointer; }
.list button:hover, .seg button:hover { background: var(--line); }
.list button[aria-pressed="true"], .seg button[aria-pressed="true"] { background: var(--on); color: var(--on-ink); }
.seg { display: flex; flex-wrap: wrap; gap: 2px; padding: 0 2px; }
.empty { padding: 6px 8px; color: var(--ink-2); }
main { position: relative; overflow: hidden; }
.stage { position: absolute; inset: 16px; display: flex; justify-content: center; align-items: flex-start; }
iframe { border: 0; background: #fff; transform-origin: top center; box-shadow: 0 0 0 1px var(--line), 0 20px 50px rgba(0, 0, 0, .45); }
@media (max-width: 700px) { body { grid-template-columns: 1fr; grid-template-rows: auto 1fr; } aside { max-height: 38vh; border-right: 0; border-bottom: 1px solid var(--line); } }
</style>
</head>
<body>
<aside>
  <h2>Surfaces</h2>
  <div class="list" id="surfaces"></div>
  <h2>Viewport</h2>
  <div class="seg" id="viewports"></div>
  <h2>States</h2>
  <div class="list" id="states"><p class="empty">—</p></div>
  <h2>Frame</h2>
  <div class="seg"><button type="button" id="reload">Reload</button><button type="button" id="open">Open alone</button></div>
</aside>
<main><div class="stage" id="stage"><iframe id="frame" title="Surface"></iframe></div></main>

<script src="system/surfaces.js"></script>
<script>
(() => {
  const WIDTHS = { desktop: 1440, tablet: 768, mobile: 390 };
  const surfaces = window.SURFACES || [];
  const frame = document.getElementById("frame");
  const stage = document.getElementById("stage");
  const read = () => Object.fromEntries(new URLSearchParams(location.hash.slice(1)));
  let sel = { s: surfaces[0]?.id, v: "desktop", st: "default", ...read() };

  const surface = () => surfaces.find((x) => x.id === sel.s) || surfaces[0];
  const buttons = (el, items, current, pick) => {
    el.replaceChildren(...items.map(([value, label]) => {
      const b = document.createElement("button");
      b.type = "button"; b.textContent = label;
      b.setAttribute("aria-pressed", String(value === current));
      b.onclick = () => pick(value);
      return b;
    }));
  };

  function fit() {
    const w = WIDTHS[sel.v] || WIDTHS.desktop;
    const scale = Math.min(1, stage.clientWidth / w);
    frame.style.width = w + "px";
    frame.style.height = stage.clientHeight / scale + "px";
    frame.style.transform = `scale(${scale})`;
  }

  function load() {
    const cur = surface();
    if (!cur) { frame.srcdoc = "<p style='font:14px system-ui;padding:24px'>No surfaces yet — add them to system/surfaces.js.</p>"; return; }
    sel.s = cur.id;
    if (!(cur.viewports || ["desktop"]).includes(sel.v)) sel.v = (cur.viewports || ["desktop"])[0];
    history.replaceState(null, "", "#" + new URLSearchParams(sel));
    buttons(document.getElementById("surfaces"), surfaces.map((x) => [x.id, `${x.label}  ·  ${x.id.split("/")[0]}`]), sel.s, (id) => { sel = { ...sel, s: id, st: "default" }; load(); });
    buttons(document.getElementById("viewports"), (cur.viewports || ["desktop"]).map((v) => [v, v]), sel.v, (v) => { sel.v = v; load(); });
    frame.src = `${cur.id}.html?r=${Date.now()}#state=${encodeURIComponent(sel.st)}`;
    fit();
  }

  window.addEventListener("message", (e) => {
    if (e.source !== frame.contentWindow || e.data?.type !== "preview:states") return;
    buttons(document.getElementById("states"), e.data.states.map((id) => [id, id]), sel.st, (id) => { sel.st = id; load(); });
  });
  document.getElementById("reload").onclick = load;
  document.getElementById("open").onclick = () => surface() && window.open(`${surface().id}.html#state=${encodeURIComponent(sel.st)}`);
  window.addEventListener("resize", fit);
  load();
})();
</script>
</body>
</html>
